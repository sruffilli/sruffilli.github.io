          const n = (fromChar(line[i] || ' ') << 18) | (fromChar(line[i + 1] || ' ') << 12) |
                    (fromChar(line[i + 2] || ' ') << 6) | fromChar(line[i + 3] || ' ');
          out.push((n >> 16) & 255);
          if (--len > 0) out.push((n >> 8) & 255);
          if (--len > 0) out.push(n & 255);
          len--;
        }
      }
      if (!sawBegin || !sawEnd) throw new Error("Invalid UUEncode format.");
      return Uint8Array.from(out);
    };
    const uuEncode = (str) => uuEncodeBytes(toBytes(str));
    const uuDecode = (str) => fromBytes(uuDecodeBytes(str));

    const hexEncode = (str) => Array.from(toBytes(str), (b) => b.toString(16).padStart(2, '0')).join('');
    const hexDecodeBytes = (str) => {
      str = str.replace(/\s+/g, '').replace(/^0x/i, '');
      if (/[^0-9A-Fa-f]/.test(str)) throw new Error("Invalid Hex character.");
      if (str.length % 2 !== 0) throw new Error("Invalid Hex string length.");
      const out = new Uint8Array(str.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(str.substr(i * 2, 2), 16);
      return out;
    };
    const hexDecode = (str) => fromBytes(hexDecodeBytes(str));

    const binEncode = (str) => Array.from(toBytes(str), (b) => b.toString(2).padStart(8, '0')).join(' ');
    const binDecodeBytes = (str) => {
      str = str.replace(/\s+/g, '');
      if (/[^01]/.test(str)) throw new Error("Invalid Binary character.");
      if (str.length % 8 !== 0) throw new Error("Invalid Binary string length.");
      const out = new Uint8Array(str.length / 8);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(str.substr(i * 8, 8), 2);
      return out;
    };
    const binDecode = (str) => fromBytes(binDecodeBytes(str));

    const BASE32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    const base32Encode = (str) => {
      const bytes = toBytes(str);
      let result = "";
      let bits = 0;
      let value = 0;
      for (const byte of bytes) {
        value = ((value << 8) | byte) & 0xffff;
        bits += 8;
        while (bits >= 5) {
          result += BASE32_ALPHABET[(value >>> (bits - 5)) & 31];
          bits -= 5;
        }
      }
      if (bits > 0) result += BASE32_ALPHABET[(value << (5 - bits)) & 31];
      while (result.length % 8 !== 0) result += "=";
      return result;
    };
    const base32DecodeBytes = (str) => {
      str = str.replace(/\s+/g, '').replace(/=+$/, "").toUpperCase();
      const out = [];
      let bits = 0;
      let value = 0;
      for (const ch of str) {
        const val = BASE32_ALPHABET.indexOf(ch);
        if (val === -1) throw new Error("Invalid Base32 character.");
        value = ((value << 5) | val) & 0xffff;
        bits += 5;
        if (bits >= 8) {
          out.push((value >>> (bits - 8)) & 255);
          bits -= 8;
        }
      }
      return Uint8Array.from(out);
    };
    const base32Decode = (str) => fromBytes(base32DecodeBytes(str));

    const BASE58_ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const BASE58_MAP = Object.fromEntries([...BASE58_ALPHABET].map((c, i) => [c, i]));
    const base58Encode = (str) => {
      const bytes = toBytes(str);
      const digits = [];
      for (const byte of bytes) {
        let carry = byte;
        for (let j = 0; j < digits.length; j++) {
          carry += digits[j] << 8;
          digits[j] = carry % 58;
          carry = (carry / 58) | 0;
        }
        while (carry) { digits.push(carry % 58); carry = (carry / 58) | 0; }
      }
      let zeros = 0;
      while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
      return '1'.repeat(zeros) + digits.reverse().map((d) => BASE58_ALPHABET[d]).join('');
    };
    const base58DecodeBytes = (str) => {
      str = str.trim();
      const bytes = [];
      for (const c of str) {
        if (!(c in BASE58_MAP)) throw new Error('Invalid Base58 character.');
        let carry = BASE58_MAP[c];
        for (let j = 0; j < bytes.length; j++) {
          carry += bytes[j] * 58;
          bytes[j] = carry & 0xff;
          carry >>= 8;
        }
        while (carry) { bytes.push(carry & 0xff); carry >>= 8; }
      }
      let zeros = 0;
      while (zeros < str.length && str[zeros] === '1') zeros++;
      return Uint8Array.from([...new Array(zeros).fill(0), ...bytes.reverse()]);
    };
    const base58Decode = (str) => fromBytes(base58DecodeBytes(str));

    // --- Hashing (Web Crypto for SHA, inline MD5: Web Crypto has no MD5) ---

    const toHex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');

    const md5 = (bytes) => {
      const K = new Uint32Array(64);
      for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 2 ** 32);
      const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
      const len = bytes.length;
      const padded = new Uint8Array((((len + 8) >> 6) + 1) << 6);
      padded.set(bytes);
      padded[len] = 0x80;
      const view = new DataView(padded.buffer);
      view.setUint32(padded.length - 8, (len * 8) >>> 0, true);
      view.setUint32(padded.length - 4, Math.floor(len / 0x20000000), true);
      let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
      const M = new Uint32Array(16);
      for (let off = 0; off < padded.length; off += 64) {
        for (let i = 0; i < 16; i++) M[i] = view.getUint32(off + i * 4, true);
        let A = a0, B = b0, C = c0, D = d0;
        for (let i = 0; i < 64; i++) {
          let F, g;
          if (i < 16) { F = (B & C) | (~B & D); g = i; }
          else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
          else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
          else { F = C ^ (B | ~D); g = (7 * i) % 16; }
          const s = S[(i >> 4) * 4 + (i % 4)];
          F = (F + A + K[i] + M[g]) >>> 0;
          A = D; D = C; C = B;
          B = (B + ((F << s) | (F >>> (32 - s)))) >>> 0;
        }
        a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
      }
      const out = new DataView(new ArrayBuffer(16));
      [a0, b0, c0, d0].forEach((v, i) => out.setUint32(i * 4, v, true));
      return toHex(new Uint8Array(out.buffer));
    };

    const HASH_ALGOS = ['MD5', 'SHA-1', 'SHA-256', 'SHA-512'];
    const hashText = async (algo, str) => {
      const bytes = toBytes(str);
      if (algo === 'MD5') return md5(bytes);
      if (!(globalThis.crypto && crypto.subtle)) {
        throw new Error("SHA hashing needs a secure context: open the page over https or as a local file.");
      }
      return toHex(new Uint8Array(await crypto.subtle.digest(algo, bytes)));
    };

    // --- Auto-detection ---
    // A candidate decoding is accepted only if it yields valid UTF-8 text
    // with no control characters, so plain words are not "decoded" into
    // binary garbage by permissive alphabets like Base32 and Base58.

    const looksLikeText = (bytes) => {
      if (!bytes.length || !isUtf8(bytes)) return false;
      const text = fromBytes(bytes);
      return !/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(text);
    };

    const autoDecode = (str) => {
      const s = str.trim();
      if (!s) return { decoded: "", format: "Auto" };

      const candidates = [
        ['UUEncode', () => /^begin \d{3} /m.test(s) && /^end\s*$/m.test(s) && uuDecodeBytes(s)],
        ['Binary', () => /^[01\s]+$/.test(s) && binDecodeBytes(s)],
        ['Hexadecimal', () => /^(0x)?[0-9a-fA-F\s]+$/.test(s) && hexDecodeBytes(s)],
        ['Base64', () => /^[A-Za-z0-9+/\s]+={0,2}$/.test(s) && s.replace(/\s+/g, '').length % 4 === 0 && base64DecodeBytes(s)],
        ['Base32', () => /^[A-Z2-7]+=*$/.test(s) && base32DecodeBytes(s)],
        ['Base58', () => /^[1-9A-HJ-NP-Za-km-z]+$/.test(s) && base58DecodeBytes(s)],
      ];
      for (const [format, attempt] of candidates) {
        try {
          const bytes = attempt();
          if (bytes && looksLikeText(bytes)) return { decoded: fromBytes(bytes), format };
        } catch (e) { }
      }

      if (/%[0-9A-Fa-f]{2}/.test(str)) {
        try { return { decoded: uriDecode(str), format: "URL Encoding" }; } catch (e) { }
      }

      return { decoded: rot13(str), format: "ROT13" };
    };

    // --- Main App Component ---

    const PUNS = [
      "ROT26: Military-grade plaintext.",
      "Base64: Security through obscurity's lazy cousin.",
      "%20is%20my%20favorite%20space%20bar.",
      "I know Base64, but what about the other 63?",
      "UUEncode: Tell me you're from the 90s without telling me.",
      "Encoding: giving your strings a fake ID.",
      "My safe word is SGVscCE=",
      "Caesar didn't die for ROT13 to be used like this.",
      "URL encoding: %57%68%79.",
      "If you think Base64 is encryption, we need to talk.",
      "SGVsbG8gV29ybGQ= (trust me bro)",
      "ROT13 twice: innovation",
      "Making gibberish slightly more professional",
      "It's not obfuscation, it's *vibes*"
    ];

    const MODES = ['encode', 'decode', 'hash'];
    const CODECS = ['Base64', 'Base32', 'Base58', 'Binary', 'Hexadecimal', 'ROT13', 'ROT26', 'URL', 'UUEncode'];
    const algosFor = (mode) => (mode === 'hash' ? HASH_ALGOS : mode === 'decode' ? ['Auto', ...CODECS] : CODECS);

    const ENCODERS = {
      Base64: base64Encode, Base32: base32Encode, Base58: base58Encode, Hexadecimal: hexEncode,
      Binary: binEncode, UUEncode: uuEncode, ROT13: rot13, ROT26: (s) => s, URL: uriEncode,
    };
    const DECODERS = {
      Base64: base64Decode, Base32: base32Decode, Base58: base58Decode, Hexadecimal: hexDecode,
      Binary: binDecode, UUEncode: uuDecode, ROT13: rot13, ROT26: (s) => s, URL: uriDecode,
    };

    // Share links carry state in the URL fragment, which never reaches the
    // server. Legacy ?query links are still read.
    const readLinkParams = () => {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      return hash.has('mode') || hash.has('text') ? hash : new URLSearchParams(window.location.search);
    };

    // The input text lives in sessionStorage: it survives a reload but not
    // closing the tab, so a pasted token does not linger on disk forever.
    const INPUT_KEY = 'stringcodec-input';

    const initialState = () => {
      const link = readLinkParams();
      const fromLink = link.has('mode') || link.has('text');
      let mode = (fromLink ? link.get('mode') : localStorage.getItem('stringcodec-mode')) || 'encode';
      if (!MODES.includes(mode)) mode = 'encode';
      let encoding = (fromLink ? link.get('algo') : localStorage.getItem('stringcodec-algo')) || '';
      if (!algosFor(mode).includes(encoding)) encoding = algosFor(mode)[mode === 'hash' ? 2 : 0];
      const input = (fromLink ? link.get('text') : sessionStorage.getItem(INPUT_KEY)) || '';
      localStorage.removeItem(INPUT_KEY); // written by older versions
      return { mode, encoding, input };
    };

    const transform = async (mode, encoding, input) => {
      if (mode === 'hash') return { output: await hashText(encoding, input), format: '' };
      if (mode === 'decode' && encoding === 'Auto') {
        const auto = autoDecode(input);
        return { output: auto.decoded, format: auto.format };
      }
      const fn = (mode === 'decode' ? DECODERS : ENCODERS)[encoding];
      if (!fn) throw new Error(`Unknown format: ${encoding}`);
      return { output: fn(input), format: '' };
    };

    function App() {
      const [initial] = useState(initialState);
      const [pun] = useState(() => PUNS[Math.floor(Math.random() * PUNS.length)]);
      const [input, setInput] = useState(initial.input);
      const [output, setOutput] = useState('');
      const [mode, setMode] = useState(initial.mode);
      const [encoding, setEncoding] = useState(initial.encoding);

      useEffect(() => {
        sessionStorage.setItem(INPUT_KEY, input);
        localStorage.setItem('stringcodec-mode', mode);
        localStorage.setItem('stringcodec-algo', encoding);
      }, [input, mode, encoding]);

      const [error, setError] = useState('');
      const [copiedLink, setCopiedLink] = useState(false);
      const [copiedOutput, setCopiedOutput] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [detectedFormat, setDetectedFormat] = useState('');

      // Recompute on every change. Hashing is async (Web Crypto), so a slow
      // result for stale input must not overwrite a newer one.
      useEffect(() => {
        let current = true;
        if (!input) {
          setOutput('');
          setError('');
          setDetectedFormat('');
          return;
        }
        transform(mode, encoding, input).then(
          ({ output, format }) => {
            if (!current) return;
            setError('');
            setOutput(output);
            setDetectedFormat(format);
          },
          (e) => {
            if (!current) return;
            setError(e.message);
            setOutput('');
            setDetectedFormat('');
          },
        );
        return () => { current = false; };
      }, [input, mode, encoding]);

      useEffect(() => {
        document.title = `StringCodec - ${pun}`;
      }, [pun]);

      useEffect(() => {
        if (encoding === 'ROT26') {
          setToastMessage("I don't know what you expected...");
          const timer = setTimeout(() => setToastMessage(''), 3000);
          return () => clearTimeout(timer);
        }
      }, [encoding]);

      const copyToClipboard = async (text, setter) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
          }
          setter(true);
          setTimeout(() => setter(false), 2000);
        } catch (err) {
          console.warn("Failed to copy:", err);
        }
      };

      const copyLink = () => {
        try {
          const params = new URLSearchParams({ mode, algo: encoding });
          if (input) params.set('text', input);
          const newUrl = `${window.location.href.split(/[?#]/)[0]}#${params}`;
          copyToClipboard(newUrl, setCopiedLink);
          try { window.history.replaceState({}, '', newUrl); } catch(e) { }
        } catch (err) {
          console.warn("Failed to generate/copy link:", err);
        }
      };

      const copyOutput = () => {
        if (output && !error) {
          copyToClipboard(output, setCopiedOutput);
        }
      };

      const handleClear = () => {
        setInput('');
      };

      const handleSwitchMode = () => {
        if (mode === 'hash') return;
        const newMode = mode === 'encode' ? 'decode' : 'encode';
        setMode(newMode);
        if (newMode === 'encode' && encoding === 'Auto') {
          setEncoding('Base64');
        }
        // Optional: Swap input and output automatically
        if (output && !error) {
          setInput(output);
        }
      };

      const homeHref = '../index.html';

      return (
        html`<div className="h-screen flex flex-col font-sans text-gray-800 bg-gray-50">

          <!-- Navbar -->
          <nav className="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 shrink-0 z-20">
            <div className="flex items-center gap-2">
              <a href=${homeHref} className="text-gray-400 hover:text-blue-600 transition-colors p-1" title="Back to Index">
                <${Icon} name="Home" className="w-5 h-5" />
              </a>
              <div className="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold text-sm ml-1">S</div>
              <div className="flex flex-col justify-center max-w-[200px] sm:max-w-md">
                <span className="font-bold tracking-tight text-sm leading-tight">String<span className="text-blue-600">Codec</span></span>
                <span className="text-[10px] text-gray-500 font-medium truncate" title=${pun}>${pun}</span>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <button
                onClick=${copyLink}
                className="text-xs font-medium text-gray-500 bg-gray-100 hover:bg-gray-200 px-2.5 py-1.5 rounded border border-gray-200 flex items-center gap-1.5 transition-colors"
              >
                ${copiedLink ? html`<${Icon} name="Check" className="w-4 h-4 text-emerald-600" />` : html`<${Icon} name="LinkIcon" className="w-4 h-4" />`}
                ${copiedLink ? html`<span className="text-emerald-600">Copied!</span>` : html`<span>Share Link</span>`}
              </button>
              <a href="https://github.com/sruffilli/sruffilli.github.io/blob/main/webutils/encoder-decoder.html" target="_blank" className="text-gray-400 hover:text-gray-900 transition-colors" title="GitHub Repository">
                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.05-.015-2.055-3.33 0-4.035-1.44-4.29-1.875-.15-.36-.75-1.44-1.29-1.725-.435-.24-1.065-.825-.015-.84 1.14-.015 1.95 1.05 2.22 1.485 1.05 1.785 2.76 1.275 3.45.975.105-.75.405-1.275.735-1.575-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.225 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405 1.02 0 2.04.135 3 .405 2.28-1.545 3.285-1.23 3.285-1.23.66 1.695.24 2.925.12 3.225.765.84 1.23 1.92 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.42.36.78 1.095.78 2.205 0 1.59-.015 2.865-.015 3.255 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" /></svg>
              </a>
            </div>
          </nav>

          <div className="flex flex-col md:flex-row flex-1 overflow-y-auto md:overflow-hidden">

            <!-- Sidebar -->
            <aside className="w-full md:w-80 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col shrink-0 z-10 shadow-sm relative">
              <div className="flex-1 overflow-y-auto p-5 space-y-6">

                <!-- Mode Selection -->
                <div className="space-y-3">
                  <div className="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <${Icon} name="RefreshCw" className="w-4 h-4" /> Mode
                  </div>
                  <div className="flex p-1 bg-gray-100 rounded-lg">
                    <button
                      className=${`flex-1 flex items-center justify-center gap-1 px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${mode === 'encode' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}
                      onClick=${() => { setMode('encode'); if (['MD5', 'SHA-1', 'SHA-256', 'SHA-512'].includes(encoding) || encoding === 'Auto') setEncoding('Base64'); }}
                    >
                      Encode
                    </button>
                    <button
                      className=${`flex-1 flex items-center justify-center gap-1 px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${mode === 'decode' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}
                      onClick=${() => { setMode('decode'); if (['MD5', 'SHA-1', 'SHA-256', 'SHA-512'].includes(encoding)) setEncoding('Auto'); }}
                    >
                      Decode
                    </button>
                    <button
                      className=${`flex-1 flex items-center justify-center gap-1 px-2 py-1.5 text-[11px] font-bold rounded-md transition-all ${mode === 'hash' ? 'bg-white shadow-sm text-blue-600' : 'text-gray-500 hover:text-gray-900'}`}
                      onClick=${() => { setMode('hash'); if (!['MD5', 'SHA-1', 'SHA-256', 'SHA-512'].includes(encoding)) setEncoding('SHA-256'); }}
                    >
                      Hash
                    </button>
                  </div>
                </div>

                <!-- Format Selection -->
                <div className="space-y-3">
                  <div className="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <${Icon} name="Code2" className="w-4 h-4" /> Format
                  </div>
                  <div className="relative">
                    <select
                      value=${encoding}
                      onChange=${(e) => setEncoding(e.target.value)}
                      className="w-full bg-white border border-gray-300 text-gray-900 font-semibold text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block px-3 py-2.5 outline-none appearance-none cursor-pointer hover:bg-gray-50"
                    >
                      ${mode === 'decode' && html`<option value="Auto">Auto-detect ✨</option>`}
                      ${mode !== 'hash' && (
                        html`
                          <option value="Base64">Base64</option>
                          <option value="Base32">Base32</option>
                          <option value="Base58">Base58</option>
                          <option value="Binary">Binary</option>
                          <option value="Hexadecimal">Hexadecimal</option>
                          <option value="ROT13">ROT13</option>
                          <option value="ROT26">ROT26</option>
                          <option value="URL">URL Encoding</option>
                          <option value="UUEncode">UUEncode</option>
                        `
                      )}
                      ${mode === 'hash' && (
                        html`
                          <option value="MD5">MD5</option>
                          <option value="SHA-1">SHA-1</option>
                          <option value="SHA-256">SHA-256</option>
                          <option value="SHA-512">SHA-512</option>
                        `
                      )}
                    </select>
                    <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                      <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                    </div>
                  </div>
                </div>

                <hr className="border-gray-200" />

                <!-- Actions -->
                <div className="space-y-3">
                  <div className="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <${Icon} name="FileText" className="w-4 h-4" /> Actions
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick=${handleSwitchMode}
                      disabled=${mode === 'hash'}
                      className=${`px-3 py-2 font-medium rounded-lg text-sm shadow-sm transition-all flex items-center justify-center gap-1.5 ${mode === 'hash' ? 'bg-gray-100 text-gray-400 cursor-not-allowed border border-gray-100' : 'bg-blue-600 hover:bg-blue-700 text-white border border-transparent'}`}
                    >
                      <${Icon} name="RefreshCw" className="w-4 h-4" />
                      Swap
                    </button>
                    <button
                      type="button"
                      onClick=${handleClear}
                      className="px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 font-medium rounded-lg text-sm border border-gray-200 transition-all flex items-center justify-center gap-1.5"
                    >
                      <${Icon} name="Trash2" className="w-4 h-4 text-gray-400" />
                      Clear
                    </button>
                  </div>
                </div>

                ${error && (
                  html`<div className="p-3 bg-red-50 border border-red-200 rounded-lg flex items-start gap-2 text-red-600 text-xs text-left">
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 mt-0.5 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" /></svg>
                    <span className="font-semibold">${error}</span>
                  </div>`
                )}

              </div>
            </aside>

            <!-- Main Content -->
            <main className="flex-1 bg-grid md:overflow-y-auto overflow-x-hidden flex flex-col relative p-4 md:p-6">

              <div className="flex flex-col h-full gap-5 mx-auto w-full max-w-4xl max-h-[900px]">
                <!-- Input Panel -->
                <div className="flex-1 flex flex-col bg-white border border-gray-200 rounded-xl shadow-sm text-gray-800 focus-within:ring-2 ring-blue-500 ring-offset-2 ring-offset-gray-50 transition-shadow">
                  <div className="bg-gray-50 px-4 py-3 border-b border-gray-200 rounded-t-xl shrink-0 flex items-center justify-between">
                    <div className="text-xs font-bold tracking-wider uppercase text-gray-500 flex items-center gap-2">
                      Input Data
                    </div>
                  </div>
                  <textarea
                    value=${input}
                    onChange=${(e) => setInput(e.target.value)}
                    placeholder=${`Paste or type string to ${mode}...`}
                    className="w-full flex-1 p-4 bg-transparent resize-none outline-none font-mono text-sm leading-relaxed"
                    spellCheck="false"
                  ></textarea>
                </div>

                <!-- Output Panel -->
                <div className="flex-1 flex flex-col bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden relative">
                  <div className="bg-gray-50 px-4 py-3 border-b border-gray-200 rounded-t-xl shrink-0 flex justify-between items-center">
                    <div className="text-xs font-bold tracking-wider uppercase text-gray-500 flex items-center gap-2">
                      ${mode === 'encode' ? 'Encoded Output' : mode === 'decode' ? (encoding === 'Auto' && detectedFormat && detectedFormat !== 'Auto' ? `Decoded Output (${detectedFormat})` : 'Decoded Output') : 'Hashed Output'}
                    </div>
                    ${output && !error && (
                      html`<button
                        onClick=${copyOutput}
                        className="text-[11px] font-bold bg-white text-blue-600 hover:text-blue-800 px-2 py-1 rounded shadow-sm border border-gray-200 flex items-center gap-1 transition-colors"
                      >
                        ${copiedOutput ? (
                          html`<${Icon} name="Check" className="w-3 h-3 text-emerald-500" /> Copied`
                        ) : (
                          html`<${Icon} name="FileText" className="w-3 h-3" /> Copy`
                        )}
                      </button>`
                    )}
                  </div>
                  <div className="w-full flex-1 p-4 overflow-auto font-mono text-sm leading-relaxed select-text">
                    ${error ? (
                      html`<div className="text-red-500 text-center mt-10 italic">Waiting for valid input...</div>`
                    ) : !input ? (
                      html`<div className="text-gray-400 text-center mt-10 italic font-sans">Result will appear here</div>`
                    ) : (
                      html`<span data-testid="output" className="text-gray-900 break-all whitespace-pre-wrap">${output}</span>`
                    )}
                  </div>
                </div>
              </div>

            </main>
          </div>

          <!-- Toast Message -->
          ${toastMessage && (
            html`<div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium z-50 flex items-center gap-2">
              <span className="text-xl">🤷‍♂️</span>
              <span>${toastMessage}</span>
            </div>`
          )}

        </div>`
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(html`<${App} />`);
  </script>
</body>

</html>
