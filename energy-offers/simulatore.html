<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <script src="theme.js?v=20261127T063118"></script>
  <title>Simulatore bolletta luce e gas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261127T063118">
  <link rel="stylesheet" href="nav.css?v=20261127T063118">
</head>
<body data-kind="luce" class="sim-page">
  <nav class="site-nav" aria-label="Sezioni del sito">
    <a href="./" data-nav="offerte">Offerte</a>
    <a href="simulatore.html" data-nav="simulatore" aria-current="page">Simulatore</a>
    <a href="./#tm" data-nav="tm">Macchina del tempo</a>
    <a href="analisi.html" data-nav="analisi">Analisi</a>
    <button type="button" class="theme-toggle" data-theme-toggle hidden>
      <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <g class="i-auto"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z"/></g>
        <g class="i-light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
        <g class="i-dark"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></g>
      </svg>
      <span class="theme-text"></span>
    </button>
    <span class="theme-live" role="status"></span>
  </nav>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Simulatore bolletta</h1>
        <p class="sub" id="dataInfo">Caricamento…</p>
      </div>
    </div>
    <nav class="tabs two" role="tablist" aria-label="Fornitura">
      <button role="tab" aria-selected="true" data-kind="luce"><span aria-hidden="true">⚡</span> Luce</button>
      <button role="tab" aria-selected="false" data-kind="gas"><span aria-hidden="true">🔥</span> Gas</button>
      <span class="tab-ink" aria-hidden="true"></span>
    </nav>
  </header>

  <main class="layout sim" id="sim">
    <aside class="controls" id="simControls" aria-label="Le voci della bolletta"></aside>

    <section class="results sim-results">
      <div class="card sim-summary">
        <div class="sim-offer" id="simOffer"></div>
        <div id="simTotal"></div>
        <p class="sr-only" id="simLive" aria-live="polite"></p>
        <div class="actions sim-actions">
          <button type="button" class="btn" id="simResetAll">Ripristina tutto</button>
          <button type="button" class="btn" id="simCopy">Copia link</button>
        </div>
      </div>

      <section class="card sim-receipt-card">
        <h3 class="eyebrow">Voce per voce</h3>
        <table class="tbl sim-tbl"><tbody id="simReceipt"></tbody></table>
      </section>

      <section class="card sim-chart-card">
        <div class="seg small-seg" id="simAxis" role="radiogroup" aria-label="Asse del grafico"></div>
        <div class="sim-chart" id="simChart"></div>
        <p class="hint" id="simChartCap"></p>
      </section>

      <footer class="foot" id="simFoot"></footer>
    </section>
  </main>

  <button type="button" class="sim-bar" id="simBar" aria-label="Vai al totale"></button>

  <script src="engine.js?v=20261127T063118"></script>
  <script src="sim.js?v=20261127T063118"></script>
  <script src="nav.js?v=20261127T063118"></script>
</body>
</html>
